name: Release desktop

# 推送形如 v0.5.0 / v0.5.0-beta.1 的 tag 时：核对版本 → 跑一遍 CI → 在各平台构建桌面安装包
# （macOS arm64 / macOS x64 / Windows x64 / Linux x64）→ 生成校验和 → 创建 GitHub Release 并上传。
# 带后缀的 tag 发为预发布。每个版本（含预发布）在 CHANGELOG.md 里都要有一节，否则失败。安装包不签名（见下面 “Package desktop app” 步骤里留的签名入口位置）。
# 手动触发（workflow_dispatch）只构建，产物留在运行页面的 Artifacts 里，不创建 Release，
# 用来在打 tag 之前演练整条流水线。流程说明见 docs/RELEASING.md。
on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

# 同一个 tag 不并行发布，也不取消已经在跑的发布。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  # 打 tag 前的完整检查（格式、lint、类型、三系统测试、构建、工作流静态检查）。
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  # 核对 tag 与版本号、决定发布类型、准备发布说明和构建矩阵。
  verify:
    name: Verify tag and plan release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
      prerelease: ${{ steps.check.outputs.prerelease }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # 下面要判断 tag 的提交是否在 main 上

      - name: Setup workspace
        uses: ./.github/actions/setup
        with:
          install: 'false'

      # tag 必须与仓库版本一致，且所有包版本一致；不一致就失败并说明怎么修。
      - name: Check tag against package versions
        id: check
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            pnpm version:check --tag "$REF_NAME"
          else
            echo "Not a tag run (manual dry run): checking package versions only."
            pnpm version:check
          fi

      # 正式版必须来自 main；预发布可以来自任何分支（用于在重构分支上试发）。
      - name: Require stable releases to come from main
        if: github.ref_type == 'tag' && steps.check.outputs.prerelease == 'false'
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Stable tag ${GITHUB_REF_NAME} points at a commit that is not on main. Merge to main first, or publish a prerelease tag (e.g. ${GITHUB_REF_NAME}-rc.1)."
            exit 1
          fi

      # 发布说明：取 CHANGELOG.md 里对应版本的小节。没有这一节的版本不能发布（正式版和预发布都一样），
      # 预发布也需要一节，例如 `## [0.5.0-beta.1] - 2026-12-01`。
      - name: Prepare release notes
        id: notes
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          mkdir -p release-notes
          if ! node --experimental-strip-types --disable-warning=ExperimentalWarning \
            tooling/release/src/cli.ts notes "$VERSION" --out release-notes/changelog.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section. A version without a changelog entry cannot be released; add the section, commit, and re-tag."
            exit 1
          fi

      # 固定说明（未签名安装包怎么打开、需要自己装 ffmpeg）由桌面端维护；有就带上。
      - name: Add fixed install notes
        run: |
          if [ -f apps/desktop/release-notes-footer.md ]; then
            cp apps/desktop/release-notes-footer.md release-notes/footer.md
          else
            echo "::notice::apps/desktop/release-notes-footer.md not found; the release will use the short default install note."
          fi

      - name: Upload release notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes
          retention-days: 7
          if-no-files-found: error

      # 构建矩阵由 tooling/release 里的 RELEASE_TARGETS 生成（也是 release job 核对产物时用的同一份清单）。
      # macOS 的 arm64 与 x64 各用自己的运行器（原生构建，不交叉编译）。
      - name: Plan build matrix
        id: plan
        run: |
          node --experimental-strip-types --disable-warning=ExperimentalWarning \
            tooling/release/src/cli.ts matrix

  build:
    name: Desktop (${{ matrix.name }})
    needs: [verify, ci]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.verify.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Electron 和 electron-builder 的下载（每个系统和架构各约 100 MB）按锁文件缓存。
      # 两个缓存目录用环境变量固定到同一个临时位置，三个系统共用同一套写法；
      # 必须在安装依赖之前设置，因为 electron 的 postinstall 就会下载二进制。
      - name: Point Electron downloads at a cached folder
        run: |
          echo "ELECTRON_CACHE=$RUNNER_TEMP/electron-cache" >> "$GITHUB_ENV"
          echo "ELECTRON_BUILDER_CACHE=$RUNNER_TEMP/electron-builder-cache" >> "$GITHUB_ENV"

      - name: Cache Electron downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/electron-cache
            ${{ runner.temp }}/electron-builder-cache
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: electron-${{ runner.os }}-${{ runner.arch }}-

      - name: Setup workspace
        uses: ./.github/actions/setup

      # `pnpm desktop:dist` 打包当前系统，产物在 apps/desktop/release/，命名 dramai-<版本>-<系统>-<架构>.<扩展名>
      # （macOS: .dmg + .zip；Windows: .exe + .zip；Linux: .AppImage + .tar.gz）。它自己会构建前端并打包应用，
      # 所以这里不需要先做全仓构建；也不需要架构参数：macOS Intel 在 macos-15-intel 运行器上原生构建，
      # 只有在 arm64 运行器上交叉打 Intel 包时才需要 `--arch x64`。
      # 不设置 GH_TOKEN，electron-builder 因此不会自己去发布（脚本里也带了 --publish never）。
      #
      # 第一版不签名，也不传任何签名相关的环境变量。以后要加签名时，在这个步骤的 env 里把
      # electron-builder 的 CSC_LINK / CSC_KEY_PASSWORD（Windows 用 WIN_CSC_*，macOS 公证用 APPLE_*）
      # 从 secrets 映射进来，并按 apps/desktop/README.md 去掉 ad-hoc 签名脚本。
      - name: Package desktop app
        run: pnpm desktop:dist

      # 只挑符合 dramai-<版本>-<系统>-<架构>.<扩展名> 的文件；一个都没有就失败。
      - name: Collect installers
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          FAMILY: ${{ matrix.family }}
          ARCH: ${{ matrix.arch }}
        run: |
          node --experimental-strip-types --disable-warning=ExperimentalWarning \
            tooling/release/src/cli.ts collect \
            --dir apps/desktop/release --out staging \
            --version "$VERSION" --family "$FAMILY" --arch "$ARCH"
          ls -l staging

      - name: Upload installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.name }}
          path: staging
          retention-days: 7
          if-no-files-found: error

  # 只在 tag 推送时运行；手动触发（演练）到上一步为止。
  release:
    name: Publish GitHub Release
    if: github.event_name == 'push'
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # 创建 Release 并上传文件；只有这个 job 有写权限
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.verify.outputs.tag }}
      VERSION: ${{ needs.verify.outputs.version }}
      PRERELEASE: ${{ needs.verify.outputs.prerelease }}
    steps:
      # 只检出 tooling/release（核对产物用的脚本），不带凭据。
      - name: Checkout release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: tooling/release
          persist-credentials: false

      # 运行器自带的 Node 可能低于 22.6，跑不了 --experimental-strip-types；版本与 .nvmrc 保持一致。
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Download installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          merge-multiple: true
          path: assets

      # 发布前核对：每个系统的安装包都在，并且没有多余的文件。缺任何一个就失败，
      # 不会发出一个少了某个系统的 Release。
      - name: Verify the full set of installers
        run: |
          node --experimental-strip-types --disable-warning=ExperimentalWarning \
            tooling/release/src/cli.ts verify-release --dir assets --version "$VERSION"

      - name: Download release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: release-notes

      - name: Generate checksums
        working-directory: assets
        run: |
          ls -l
          sha256sum dramai-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # 发布说明 = CHANGELOG 小节 + 固定的“怎么打开未签名安装包 / 需要自己装 ffmpeg”说明 + 校验方法。
      # 固定说明由桌面端维护在 apps/desktop/release-notes-footer.md；文件不存在时用下面的简短默认文字。
      - name: Compose release notes
        run: |
          {
            cat release-notes/changelog.md
            printf '\n\n---\n\n'
            if [ -f release-notes/footer.md ]; then
              cat release-notes/footer.md
            else
              echo "### Installing"
              echo
              echo "These installers are **not code-signed**, so macOS and Windows will warn the first time you open them. You also need to install ffmpeg yourself."
              echo
              echo "这些安装包**没有代码签名**，首次打开时 macOS 和 Windows 会弹出安全提示；另外需要自己安装 ffmpeg。"
            fi
            echo
            echo "### Verify your download"
            echo
            echo "Compare the SHA-256 of the file you downloaded with its line in \`SHA256SUMS.txt\`: \`shasum -a 256 <file>\` on macOS and Linux, \`Get-FileHash <file>\` in Windows PowerShell."
          } > release-body.md
          cat release-body.md

      # 先建草稿、传完所有文件、再发布，用户不会看到只传了一半的 Release。
      # 重跑时：草稿会被刷新；已经发布的同名 Release 不会被覆盖。
      - name: Create or refresh draft release
        run: |
          shopt -s nullglob
          files=(assets/dramai-* assets/SHA256SUMS.txt)
          flags=(--title "dramai $TAG" --notes-file release-body.md)
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); else flags+=(--latest); fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "::error::Release $TAG is already published. Delete it (and its tag) or bump the version; published assets are never overwritten."
              exit 1
            fi
            echo "Draft release $TAG exists; refreshing its assets."
            # 草稿里上次运行留下的、不在这次文件清单里的资源要删掉，否则会被一起发布出去
            current="$(printf '%s\n' "${files[@]}" | xargs -n1 basename)"
            for asset in $(gh release view "$TAG" --json assets --jq '.assets[].name'); do
              if ! printf '%s\n' "$current" | grep -qxF "$asset"; then
                echo "Removing stale asset $asset from the draft"
                gh release delete-asset "$TAG" "$asset" --yes
              fi
            done
            gh release upload "$TAG" "${files[@]}" --clobber
            gh release edit "$TAG" "${flags[@]}"
          else
            gh release create "$TAG" "${files[@]}" --draft --verify-tag "${flags[@]}"
          fi

      - name: Publish release
        run: |
          gh release edit "$TAG" --draft=false
          gh release view "$TAG" --json url,isPrerelease,assets --jq '"\(.url) prerelease=\(.isPrerelease) assets=\([.assets[].name]|join(", "))"'
